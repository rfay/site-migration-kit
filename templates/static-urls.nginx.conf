# Serve a crawled static site whose pages were saved as /a/b.html (or /a/b/index.html) at the
# extensionless URLs the original used: /a/b.
#
# A regular-expression location beats the stock "location /" prefix, and the pattern matches only
# paths with no dot, so real files (/files/x.pdf, /css/site.css) are untouched.
# Order: a/b.html, then a/b/index.html, then a directory index, otherwise 404.
location ~ ^/[^.]*$ {
    try_files $uri.html $uri/index.html $uri/ =404;
}
